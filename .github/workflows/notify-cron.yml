name: Anveshan schedule notifications

# Vercel's Hobby plan only allows once-a-day cron, which is useless for
# same-day auto-alerts ("get ready", "you're up"). This runs on GitHub's
# free scheduler instead and just hits the same endpoint.
#
# Setup (one-time, in this repo's Settings -> Secrets and variables ->
# Actions):
#   APP_URL      = https://your-app.vercel.app   (no trailing slash)
#   CRON_SECRET  = same value as in Vercel's env vars
#
# GitHub's schedule trigger is best-effort and can lag a few minutes
# under load — fine for this use case (15-minute-window alerts).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/notify
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/notify" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
